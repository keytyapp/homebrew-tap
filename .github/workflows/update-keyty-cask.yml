name: Update Keyty Cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: Keyty version without a leading v
        required: true
        type: string
      tag:
        description: Release tag, for example v1.1.0
        required: true
        type: string
      dmg_url:
        description: Direct download URL for the DMG asset
        required: true
        type: string
      sha256:
        description: SHA-256 digest for the DMG asset
        required: true
        type: string
  repository_dispatch:
    types:
      - keyty_release_published

permissions:
  contents: write
  pull-requests: write

jobs:
  update-cask:
    runs-on: macos-latest

    steps:
      - name: Check out tap repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="${{ github.event.inputs.version || github.event.client_payload.version }}"
          tag="${{ github.event.inputs.tag || github.event.client_payload.tag }}"
          dmg_url="${{ github.event.inputs.dmg_url || github.event.client_payload.dmg_url }}"
          sha256="${{ github.event.inputs.sha256 || github.event.client_payload.sha256 }}"

          if [[ -z "$version" || -z "$tag" || -z "$dmg_url" || -z "$sha256" ]]; then
            echo "missing required release metadata" >&2
            exit 1
          fi

          if [[ "$tag" != v* ]]; then
            echo "tag must start with v, got: $tag" >&2
            exit 1
          fi

          if [[ "$version" == v* ]]; then
            echo "version must not start with v, got: $version" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "dmg_url=$dmg_url"
            echo "sha256=$sha256"
            echo "branch=release/keyty-$version"
          } >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update cask
        run: ./script/update-keyty-cask.sh "${{ steps.release.outputs.version }}" "${{ steps.release.outputs.dmg_url }}" "${{ steps.release.outputs.sha256 }}"

      - name: Audit cask
        run: brew audit --cask --online Casks/keyty.rb

      - name: Create branch and commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ steps.release.outputs.branch }}"
          git checkout -B "$branch"

          if git diff --quiet -- Casks/keyty.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add Casks/keyty.rb
          git commit -m "keyty ${{ steps.release.outputs.version }}"
          git push --force-with-lease --set-upstream origin "$branch"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or reuse pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ steps.release.outputs.branch }}"
          existing_pr="$(gh pr list --head "$branch" --json url --jq '.[0].url')"

          if [[ -n "$existing_pr" ]]; then
            echo "pull request already exists: $existing_pr"
            exit 0
          fi

          cat > pr-body.md <<EOF
          Update the Keyty Homebrew cask for release ${{ steps.release.outputs.tag }}.

          - Version: ${{ steps.release.outputs.version }}
          - Tag: ${{ steps.release.outputs.tag }}
          - DMG: ${{ steps.release.outputs.dmg_url }}
          - SHA-256: ${{ steps.release.outputs.sha256 }}
          EOF

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update Keyty cask to ${{ steps.release.outputs.version }}" \
            --body-file pr-body.md
